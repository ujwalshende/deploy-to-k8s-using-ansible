---
- name: Deploy app in a new namespace
  hosts: localhost
  tasks:
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: ~/terraform/kubeconfig_myapp-eks-cluster
    - name: Deploy nginx app
      kubernetes.core.k8s:
        src: https://raw.githubusercontent.com/ujwalshende/deploy-to-k8s-using-ansible/master/nginx.yaml
        state: present
        kubeconfig: ~/terraform/kubeconfig_myapp-eks-cluster
        namespace: my-app
        
